name: Question
description: Ask how to do something in Notus.
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue will be public.** Please don't include license keys, API keys, passwords, tokens or the contents of your notebooks.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: "Tip: the full manual is built into Notus and works offline — try Help → Documentation first."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Notus version
      placeholder: "e.g. 1.0.0 — Help → About Notus"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. macOS 15 (Apple silicon), Windows 11, Ubuntu 24.04"
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Privacy check
      options:
        - label: I have not included license keys, API keys, passwords, tokens or private notebook content.
          required: true
